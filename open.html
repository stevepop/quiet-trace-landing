<!DOCTYPE html>
<!--
  /open — the destination for the "Open QuietTrace" button in the daily reminder email.

  WHY THIS PAGE EXISTS. EMAIL_REMINDERS_PLAN.md §7 in the app repo weighed three options for
  where that button should point: a small static page here, proper universal links, or no
  link at all. It chose this one — "simplest, one page, works everywhere, slightly limp" —
  with universal links (apple-app-site-association + assetlinks.json + entitlement changes on
  both platforms) deferred to a build of their own. Until this file existed the button
  returned a 404 on the live site.

  NO AUTO-REDIRECT, deliberately. Firing `quiettrace://` on load looks slicker and fails
  badly: on desktop, and in any webview where the app is not installed, the browser throws an
  "address wasn't understood" dialog over a page the user did not choose to visit. Most
  reminder emails are opened in Gmail's or Outlook's in-app browser, which is exactly where
  that misfires. An explicit button does nothing until it is tapped.

  NO ANALYTICS, NO TRACKING PIXEL, NO WRAPPED LINKS. §7 rules them out for the email, and a
  privacy app measuring whether you opened your reminder would be silly on the landing page
  too. This file loads nothing from anywhere.

  noindex because this is a destination from email, not a page anyone should reach by search.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open QuietTrace</title>
  <meta name="description" content="Open the QuietTrace app, or get it for iOS and Android." />
  <meta name="robots" content="noindex, follow" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --forest:   #2E6B4F;
      --sage:     #4A7C5F;
      --offwhite: #F8F7F4;
      --white:    #FFFFFF;
      --text-dark:#1C2B22;
      --text-mid: #3D5244;
      --text-soft:#6B7C72;
      --divider:  #D6EDE2;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background: var(--offwhite);
      color: var(--text-dark);
      -webkit-font-smoothing: antialiased;
      line-height: 1.7;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(248, 247, 244, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--divider);
      padding: 0 24px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }

    .nav-logo-mark {
      width: 32px; height: 32px;
      background: var(--forest);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
    }

    .nav-logo-mark span {
      color: var(--white);
      font-weight: 700;
      font-size: 18px;
      line-height: 1;
    }

    .nav-wordmark {
      color: var(--text-dark);
      font-weight: 700;
      font-size: 17px;
      letter-spacing: -0.3px;
    }

    .nav-back {
      color: var(--sage);
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
    }

    .nav-back:hover { text-decoration: underline; }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 56px 24px 64px;
    }

    .mark {
      width: 72px; height: 72px;
      background: var(--forest);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 28px;
    }

    .mark span { color: var(--white); font-weight: 700; font-size: 36px; line-height: 1; }

    h1 {
      font-size: clamp(28px, 6vw, 36px);
      font-weight: 700;
      letter-spacing: -0.6px;
      line-height: 1.2;
      margin-bottom: 12px;
    }

    .lede {
      color: var(--text-mid);
      font-size: 17px;
      max-width: 34ch;
      margin-bottom: 36px;
    }

    .open-app {
      display: inline-block;
      background: var(--sage);
      color: var(--white);
      text-decoration: none;
      font-size: 17px;
      font-weight: 600;
      padding: 16px 48px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }

    .open-app:hover { background: var(--forest); }

    .hint {
      color: var(--text-soft);
      font-size: 14px;
      margin-top: 18px;
      max-width: 38ch;
    }

    .rule {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      max-width: 360px;
      margin: 44px 0 28px;
      color: var(--text-soft);
      font-size: 13px;
    }

    .rule::before, .rule::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--divider);
    }

    .badges { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
    .badges img { height: 52px; display: block; }

    footer {
      border-top: 1px solid var(--divider);
      padding: 28px 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px 24px;
      align-items: center;
      justify-content: space-between;
      color: var(--text-soft);
      font-size: 14px;
    }

    .footer-links { display: flex; flex-wrap: wrap; gap: 20px; }
    .footer-links a { color: var(--text-soft); text-decoration: none; }
    .footer-links a:hover { color: var(--sage); text-decoration: underline; }
  </style>
</head>
<body>

  <nav>
    <a class="nav-logo" href="/">
      <div class="nav-logo-mark">
        <span>Q</span>
      </div>
      <span class="nav-wordmark">QuietTrace</span>
    </a>
    <a class="nav-back" href="/">← Back to home</a>
  </nav>

  <main>
    <div class="mark"><span>Q</span></div>

    <h1>A quiet moment for today.</h1>
    <p class="lede">Open QuietTrace and write a few lines — or don't. Either is fine.</p>

    <!--
      quiettrace:// is the app's registered URL scheme on both platforms (CFBundleURLSchemes
      in ios/Runner/Info.plist, android:scheme in AndroidManifest.xml). Plain href rather
      than script: if the app is not installed, nothing happens until the user taps, and the
      store badges below are already on screen as the obvious next thing.
    -->
    <a class="open-app" href="quiettrace://">Open the app</a>

    <p class="hint">If nothing happens, QuietTrace isn't installed on this device yet.</p>

    <div class="rule">or get the app</div>

    <div class="badges">
      <a href="https://apps.apple.com/app/quiettrace/id6765769312" aria-label="Download on the App Store">
        <img src="/badges/app_store_white.png" alt="Download on the App Store" height="52" />
      </a>
      <a href="https://play.google.com/store/apps/details?id=com.stevepop.quiet_trace" aria-label="Get it on Google Play">
        <img src="/badges/google_play_white.png" alt="Get it on Google Play" height="52" />
      </a>
    </div>
  </main>

  <footer>
    <div class="footer-left">&copy; 2026 QuietTrace</div>
    <div class="footer-links">
      <a href="/privacy.html">Privacy Policy</a>
      <a href="/terms.html">Terms of Service</a>
      <a href="/support.html">Support</a>
      <a href="mailto:hello@quiettrace.app">Contact</a>
    </div>
  </footer>

</body>
</html>
